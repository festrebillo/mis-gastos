<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<div id="cap"></div>
<div id="app"></div>
<div id="capb"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy" aria-hidden="true"><div class="orbit"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i><i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i></div><p id="busy-t">Cargando…</p></div>
<div id="okpop" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-18"/></svg></div>
<div id="splash" aria-hidden="true">
  <svg class="sp" viewBox="0 40 200 275" aria-hidden="true">
    <defs><linearGradient id="spb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--sp2,#A9A9B1)"/><stop offset="1" style="stop-color:var(--sp1,#FFFFFF)"/></linearGradient><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E2E2E6"/><stop offset="1" stop-color="#A9A9B1"/></linearGradient></defs>
    <g class="sp-co"><g transform="translate(100 176) scale(2.1)"><circle r="20" fill="url(#spg)"/><circle r="15.6" fill="none" stroke="#8A8A92" stroke-width="1.4" opacity=".7"/><text y="6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="17" fill="#3A3A40">S/</text></g></g>
    <rect class="sp-bar" x="30" y="236" width="22" height="64" rx="6" fill="url(#spb)" opacity=".6" style="animation-delay:.72s"/>
    <rect class="sp-bar" x="60" y="206" width="22" height="94" rx="6" fill="url(#spb)" opacity=".7" style="animation-delay:.77s"/>
    <rect class="sp-bar" x="90" y="176" width="22" height="124" rx="6" fill="url(#spb)" opacity=".8" style="animation-delay:.82s"/>
    <rect class="sp-bar" x="120" y="146" width="22" height="154" rx="6" fill="url(#spb)" opacity=".9" style="animation-delay:.88s"/>
    <rect class="sp-bar" x="150" y="106" width="22" height="194" rx="6" fill="url(#spb)" style="animation-delay:.93s"/>
    <path class="sp-ln" pathLength="300" d="M24 214L71 184L101 196L131 132L168 78" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="sp-ln" pathLength="300" d="M150 78H168V96" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="sp-sa" fill="#fff"><path transform="translate(172 52)" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/><path transform="translate(30 150) scale(.7)" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/><path transform="translate(120 100) scale(.55)" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/></g>
  </svg>
  <p class="sp-nm">Mis Gastos</p>
  <p class="sp-sd"></p>
</div>
<script src="demo.js"></script>
<script src="app.js"></script>

</html>
